function fetchLive(slug){
  var b=REPORTS.beacon;
  if(!b||!b.url)return Promise.resolve(null);
  return fetch(b.url+'/rest/v1/rpc/bbre_summary',{
    method:'POST',
    headers:{apikey:b.key,Authorization:'Bearer '+b.key,'Content-Type':'application/json'},
    body:JSON.stringify({p_slug:slug})
  }).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
}
function agoText(iso){
  if(!iso)return 'never';
  var d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return 'just now';
  if(d<3600)return Math.round(d/60)+'m ago';
  if(d<86400)return Math.round(d/3600)+'h ago';
  return Math.round(d/86400)+'d ago';
}
function anCard(v,l){return '<div class="an-card"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'}
function renderAnalytics(){
  M=loadM();
  var ss=M.sessions||[],cs=ss.filter(function(x){return x.role==='client'});
  var avg=ss.length?ss.reduce(function(a,x){return a+(x.end-x.start)},0)/ss.length:0;
  var maxT=1;
  CFG.slides.forEach(function(s){maxT=Math.max(maxT,M.time[s.id]||0)});

  var body=$('#anBody');
  body.innerHTML='<div class="an-sec">Live · what the client actually did</div><p class="an-note">Loading from the Business Booster beacon…</p>';

  var b=REPORTS.beacon;
  var fbP=(b&&b.url)?fetch(b.url+'/rest/v1/rpc/bbre_feedback_summary',{method:'POST',
    headers:{apikey:b.key,Authorization:'Bearer '+b.key,'Content-Type':'application/json'},
    body:JSON.stringify({p_slug:CFG.meta.slug})}).then(function(r){return r.ok?r.json():null}).catch(function(){return null})
    :Promise.resolve(null);
  Promise.all([fetchLive(CFG.meta.slug),fbP]).then(function(all){
    var rows=all[0],fb=(all[1]&&all[1][0])||null;
    var h='';
    if(!rows){
      h+='<div class="an-sec">Live · what the client actually did</div>'
        +'<p class="an-note">Could not reach the beacon. Check the connection and press Refresh.</p>';
    }else{
      var opens=0,last=null,per={},maxL=1,best=null;
      rows.forEach(function(r){
        if(r.kind==='opens'){opens=+r.n;last=r.latest}
        else if(r.slide_id){per[r.slide_id]=+r.n;maxL=Math.max(maxL,+r.n)}
      });
      CFG.slides.forEach(function(s,i){
        var v=per[s.id]||0;
        if(!best||v>best.v)best={s:s,i:i,v:v};
      });
      /* drop-off: first slide whose views fall below half the opening slide */
      var firstV=per[CFG.slides[0].id]||0,drop=null;
      if(firstV>0){
        for(var i=0;i<CFG.slides.length;i++){
          if((per[CFG.slides[i].id]||0) < firstV/2){drop=i;break}
        }
      }
      h+='<div class="an-cards">'
        +anCard(opens,'Client opens')
        +anCard(agoText(last),'Last opened')
        +anCard(best&&best.v?pad2(best.i+1):'None','Most viewed slide')
        +anCard(drop!==null?pad2(drop+1):'Reaches the end','Drop-off point')
        +'</div>';
      h+='<div class="an-sec">Live · views per slide ('+esc(CFG.client.name)+')</div>';
      CFG.slides.forEach(function(s,i){
        var v=per[s.id]||0;
        h+='<div class="an-row"><span class="idx">'+pad2(i+1)+'</span>'
          +'<span><span class="nm">'+esc(s.headline||s.id)+'</span>'
          +'<span class="an-bar"><i style="width:'+(v/maxL*100).toFixed(1)+'%"></i></span></span>'
          +'<span class="n">'+v+'</span><span class="n">views</span></div>';
      });
    }

    h+='<div class="an-sec">This device only · time spent</div>';
    h+='<div class="an-cards">'+anCard(ss.length,'Sessions here')+anCard(fmtDur(avg),'Avg length here')+'</div>';
    CFG.slides.forEach(function(s,i){
      var t=M.time[s.id]||0,o=M.opens[s.id]||0;
      h+='<div class="an-row"><span class="idx">'+pad2(i+1)+'</span>'
        +'<span><span class="nm">'+esc(s.headline||s.id)+'</span>'
        +'<span class="an-bar"><i style="width:'+(t/maxT*100).toFixed(1)+'%"></i></span></span>'
        +'<span class="n">'+fmtDur(t)+'</span><span class="n">'+o+' opens</span></div>';
    });
    h+='<p class="an-note">Written feedback is stored privately and is not readable from this page. Ask for it any time. Live figures count every client opening of this report on any device. Time per slide is measured on this device only.</p>';
    body.innerHTML=h;
  });
}

/* ---------------- navigation: directional depth ---------------- */
function clearAnim(el){
  el.classList.remove('in-fwd','in-back','in-jump','out-fwd','out-back','out-jump','leaving');
}
function go(i,mode){
  if(!CFG)return;
  i=Math.max(0,Math.min(N-1,i));
  if(i===cur)return;
  if(transBusy){pendingGo={i:i,mode:mode};return}
  mode=mode||(i>cur?'fwd':'back');
  if(cur<0)mode='jump';
  var now=Date.now();
  var oldIdx=cur,oldEl=cur>=0?slideEls[cur]:null;
  if(cur>=0)trackLeave(cur,now);
  cur=i;
  var el=slideEls[i];
  var rev=!!visited[i];
  transBusy=true;
  slideEls.forEach(function(s,j){
    if(s!==el&&s!==oldEl){clearAnim(s);s.classList.remove('on');s.inert=true;s.setAttribute('aria-hidden','true')}
  });
  if(oldEl){
    clearAnim(oldEl);
    oldEl.classList.remove('on');
    oldEl.classList.add('leaving',mode==='fwd'?'out-fwd':mode==='back'?'out-back':'out-jump');
    oldEl.inert=true;oldEl.setAttribute('aria-hidden','true');
  }
  clearAnim(el);
  el.classList.add('on',mode==='fwd'?'in-fwd':mode==='back'?'in-back':'in-jump');
  el.classList.toggle('revisit',rev);
  el.inert=false;el.setAttribute('aria-hidden','false');
  var inner=el.querySelector('.slide-inner');if(inner)inner.scrollTop=0;
  /* transition perf mode: glass blur off while the stage moves */
  document.documentElement.classList.add('trans');
  setTimeout(function(){
    if(oldEl)clearAnim(oldEl);
    document.documentElement.classList.remove('trans');
    transBusy=false;
    if(pendingGo){var p=pendingGo;pendingGo=null;go(p.i,p.mode)}
  },REDUCED?280:600);
  trackEnter(i,now);
  visited[i]=true;
  try{localStorage.setItem(K('last'),String(i))}catch(e){}
  counter.innerHTML='<b class="roll">'+pad2(i+1)+'</b><span>/'+pad2(N)+'</span>';
  var ann=document.getElementById('announcer');
  if(ann)ann.textContent='Slide '+(i+1)+' of '+N+': '+(CFG.slides[i].headline||CFG.slides[i].id);
  if(CFG.slides[i].id==='next-steps'){
    var sel='';try{sel=localStorage.getItem(K('tier'))||''}catch(err){}
    if(sel)document.querySelectorAll('.acc-tier').forEach(function(b){b.classList.toggle('on',b.dataset.t===sel)});
  }
  var pn=document.getElementById('pnote');
  if(!pn){pn=document.createElement('div');pn.id='pnote';pn.hidden=true;document.body.appendChild(pn)}
  var noteTxt=CFG.slides[i].pnote;
  if(session&&session.role==='master'&&noteTxt){pn.textContent=noteTxt;pn.hidden=false}else pn.hidden=true;
  var ask=document.getElementById('askWa');
  if(ask){
    var ph=(CFG.agency.contact&&CFG.agency.contact.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'94');
    if(ph){ask.hidden=false;ask.href='https://wa.me/'+ph+'?text='+encodeURIComponent('Hi, a quick question about "'+(CFG.slides[i].headline||CFG.slides[i].id)+'" in the '+CFG.client.name+' report.')}
    else ask.hidden=true;
  }
  pct.textContent=Math.round((i+1)/N*100)+'%';
  progressFill.style.width=((i+1)/N*100)+'%';
  Array.prototype.forEach.call(rail.children,function(d,j){d.classList.toggle('on',j===i)});
  btnPrev.disabled=i===0;
  btnNext.disabled=i===N-1;
  countUps(el,rev);
  if(i===N-1)setTimeout(function(){if(cur===N-1)askFeedback()},2600);
  suppressHash=true;
  try{
    if(oldIdx<0)history.replaceState(null,'','#'+CFG.slides[i].id);
    else history.pushState(null,'','#'+CFG.slides[i].id);
  }catch(e){}
  setTimeout(function(){suppressHash=false},0);
}
function idxFromHash(){
  if(!CFG)return -1;
  var h=decodeURIComponent(location.hash.replace('#',''));
  if(!h)return -1;
  var idx=-1;
  CFG.slides.forEach(function(s,i){if(s.id===h)idx=i});
  if(idx<0&&/^\d+$/.test(h)){var n=parseInt(h,10);if(n>=1&&n<=N)idx=n-1}
  return idx;
}
addEventListener('hashchange',function(){
  if(suppressHash||app.hidden)return;
  var idx=idxFromHash();
  if(idx>=0&&idx!==cur)go(idx,'jump');
});
addEventListener('popstate',function(){
  if(suppressHash||app.hidden)return;
  var idx=idxFromHash();
  if(idx>=0&&idx!==cur)go(idx,'jump');
});

/* ---------------- boot: a PIN resolved a client, build THEIR report ---------------- */
function normName(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\b(pvt|ltd|limited|and|the|company|co)\b/g,' ').replace(/\s+/g,' ').trim()}
function nameMatches(typed,c){
  var t=normName(typed);
  if(!t)return false;
  var pool=[c.label,c.client&&c.client.name,c.client&&c.client.wordmark,c.slug].filter(Boolean).map(normName);
  for(var i=0;i<pool.length;i++){
    var p=pool[i];
    if(!p)continue;
    if(t===p||p.indexOf(t)===0||t.indexOf(p)===0)return true;
    if(p.split(' ')[0]&&t.split(' ')[0]===p.split(' ')[0])return true;
  }
  return false;
}
function findBySlug(slug){
  var f=null;REPORTS.clients.forEach(function(c){if(c.slug===slug)f=c});return f;
}
function boot(c,role,name,dissolve){
  KINETIC=!!dissolve;
  var mode=c.mode||'pitch';
  var activeSlides=(c.slides||[]).filter(function(s){return !s.modes||s.modes.indexOf(mode)>=0});
  CFG={
    meta:c.meta,client:c.client,agency:c.agency,theme:c.theme,slides:activeSlides,
    auth:{clientLabel:c.label,clientPin:c.pin,sessionHours:REPORTS.sessionHours||72}
  };
  CFG.meta.slug=c.slug;
  N=CFG.slides.length;
  session={role:role,name:name,slug:c.slug,t:Date.now()};
  try{localStorage.setItem(SKEY,JSON.stringify(session))}catch(e){}
  /* theme + tab identity flip to the client */
  var t=CFG.theme,r=document.documentElement.style;
  r.setProperty('--bg',t.bg);r.setProperty('--surface',t.surface);
  r.setProperty('--pri',t.primary);r.setProperty('--acc',t.accent);
  r.setProperty('--tp',t.textPrimary);r.setProperty('--tm',t.textMuted);
  r.setProperty('--bd',t.border);
  document.documentElement.lang=CFG.meta.lang||'en-GB';
  document.title=CFG.client.name+' - Consultancy Report';
  var mtc=document.querySelector('meta[name="theme-color"]');if(mtc)mtc.content=t.bg;
  if(CFG.client.logo)r.setProperty('--wm-url','url("'+CFG.client.logo+'")');
  var fav=document.querySelector('link[rel="icon"]')||document.createElement('link');
  fav.rel='icon';
  if(CFG.client.logo)fav.href=CFG.client.logo;
  else{
    try{
      var cv=document.createElement('canvas');cv.width=64;cv.height=64;
      var x=cv.getContext('2d');
      x.fillStyle=t.primary;x.beginPath();
      if(x.roundRect)x.roundRect(0,0,64,64,16);else x.rect(0,0,64,64);
      x.fill();
      x.fillStyle=t.bg;x.font='700 38px Georgia,serif';x.textAlign='center';x.textBaseline='middle';
      x.fillText((CFG.client.name||'R').trim().charAt(0).toUpperCase(),32,36);
      fav.href=cv.toDataURL('image/png');
    }catch(e){}
  }
  if(!fav.parentNode&&fav.href)document.head.appendChild(fav);
  document.body.dataset.draft=c.draft?'1':'0';
  if(!CFG.client.logo)console.warn('[cast] client logo missing for "'+c.slug+'": rendering the text wordmark fallback. Embed a base64 logo in client.logo before sending.');
  $('#tbBrand').innerHTML=brandHTML(CFG.client)+'<span class="tb-draft">Draft</span>';
  /* fresh state + build */
  M=loadM();visited={};cur=-1;transBusy=false;pendingGo=null;sessIdx=-1;
  buildSlides();buildRail();buildOverview();
  applyEdits();
  var start=function(){
    login.style.display='none';
    app.hidden=false;
    btnAnalytics.hidden=role!=='master';
    var bl=document.getElementById('btnLibrary');
    if(bl)bl.hidden=role!=='master';
    var be=document.getElementById('btnEdit');
    if(be)be.hidden=role!=='master';
    startSession(role);
    fire('open',null);
    var idx=idxFromHash();
    var last=0;
    try{last=parseInt(localStorage.getItem(K('last'))||'0',10)||0}catch(e){}
    kineticEntry(function(){go(idx>=0?idx:0,'jump')});
    if(SELFTEST){SELFTEST=false;setTimeout(runSelfTest,1200)}
    if(idx<0&&last>0&&last<N){
      $('#resumeYes').textContent='Resume at '+pad2(last+1);
      resumeEl.hidden=false;
      var kill=setTimeout(function(){resumeEl.hidden=true},9000);
      $('#resumeYes').onclick=function(){clearTimeout(kill);resumeEl.hidden=true;go(last,'jump')};
      $('#resumeNo').onclick=function(){clearTimeout(kill);resumeEl.hidden=true};
    }
  };
  if(dissolve&&!REDUCED){
    login.classList.add('done');
    setTimeout(start,430);
  }else start();
  showTourOnce();
}
function showTourOnce(){

  var ov=document.createElement('div');

function resetAllData(){
  var secret=prompt('This clears every open, slide view and rating for ALL reports.\nEnter the master passphrase to confirm.');
  if(!secret)return;
  bfetch('/rest/v1/rpc/bbre_reset',{p_secret:secret}).then(function(r){
    if(r===null){alert('Could not reach the beacon. Nothing was cleared.');return}
    if(r==='denied'){alert('That passphrase does not match. Nothing was cleared.');return}
    try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('bbre_')===0&&k.indexOf('_metrics')>0)localStorage.removeItem(k)})}catch(err){}
    LIB_SUM={};
    alert(r);
    fillLibraryLive();
  });
}
function stripCard(v,l){return '<div class="ls-card"><div class="v">'+v+'</div><div class="l">'+esc(l)+'</div></div>'}
function liveCell(k,l,v){return '<div class="lv-cell"><b class="lv" data-k="'+k+'">'+v+'</b><span>'+l+'</span></div>'}
function bfetch(path,body){
  var b=REPORTS.beacon;
  if(!b||!b.url)return Promise.resolve(null);
  return fetch(b.url+path,{method:'POST',
    headers:{apikey:b.key,Authorization:'Bearer '+b.key,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})
  }).then(function(r){return r.ok?r.json():null}).catch(function(){return null});
}
var LIB_SUM={};
function fillLibraryLive(){
  var ov=document.getElementById('library');if(!ov)return;
  function setAll(sel,txt){ov.querySelectorAll(sel).forEach(function(n){n.textContent=txt;n.classList.add('off')})}
  bfetch('/rest/v1/rpc/bbre_portfolio').then(function(rows){
    if(!rows){
      setAll('.lv','offline');
      return;
    }
    var by={};rows.forEach(function(r){by[r.slug]=r});
    var week=0,active=null,bestOpens=0,attention=[];
    REPORTS.clients.forEach(function(c){
      var r=by[c.slug]||{opens:0,opens_7d:0,last_open:null,fb_n:0,fb_avg:null};
      week+=(+r.opens_7d||0);
      if((+r.opens_7d||0)>bestOpens){bestOpens=+r.opens_7d;active=c}
      if(!r.last_open)attention.push(c.label+' (never opened)');

      var card=ov.querySelector('.lib-card[data-slug="'+c.slug+'"]');
      if(!card)return;
      card.querySelector('[data-k="opens"]').textContent=r.opens;
      card.querySelector('[data-k="last"]').textContent=agoText(r.last_open);
      card.querySelector('[data-k="rating"]').textContent=r.fb_n>0?(r.fb_avg+' / 10 ('+r.fb_n+')'):'None yet';
    });
    var st=ov.querySelector('#libStrip');
    if(st){
      st.querySelector('[data-k="week"]').textContent=week;
      st.querySelector('[data-k="active"]').textContent=active?active.label:'No opens yet';
      st.querySelector('[data-k="attention"]').textContent=attention.length?attention.join(', '):'All reports opened recently';
    }
  });
  REPORTS.clients.forEach(function(c){
    bfetch('/rest/v1/rpc/bbre_summary',{p_slug:c.slug}).then(function(rows){
      var card=ov.querySelector('.lib-card[data-slug="'+c.slug+'"]');
      if(!card)return;
      var cell=card.querySelector('[data-k="drop"]');
      if(!rows){cell.textContent='offline';cell.classList.add('off');return}
      LIB_SUM[c.slug]=rows;
      var per={};rows.forEach(function(r){if(r.kind==='slide'&&r.slide_id)per[r.slide_id]=+r.n});
      var slides=c.slides||[];
      var firstV=per[(slides[0]||{}).id]||0,drop=null;
      if(firstV>0)for(var i=0;i<slides.length;i++){if((per[slides[i].id]||0)<firstV/2){drop=i;break}}
      cell.textContent=drop!==null?('Slide '+pad2(drop+1)):'Reaches the end';
    });
  });
}

var failCount=0,lockUntil=0;
$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();

  if(now<lockUntil)return;
  var name=$('#inName').value.trim(),pin=$('#inPin').value.trim();
  var err=$('#loginErr'),card=$('#loginCard');
  var match=null,matchRole='client',pinOnly=null;
  REPORTS.clients.forEach(function(c){
    var hit=null;
    if(pin&&pin===c.pin)hit='client';
    else if(pin&&c.teamPin&&pin===c.teamPin)hit='team';

    Array.prototype.forEach.call(root.querySelectorAll('[data-r]'),function(e){e.classList.add('vis')});return;
  }
  if(bbIO)bbIO.disconnect();
  bbIO=new IntersectionObserver(function(es){
    es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('vis');bbIO.unobserve(en.target)}});
  },{root:root,rootMargin:'0px 0px -8% 0px',threshold:.06});
  Array.prototype.forEach.call(root.querySelectorAll('[data-r]'),function(e,i){
    e.style.transitionDelay=Math.min(i%6,5)*55+'ms';bbIO.observe(e);

/* keyboard */
addEventListener('keydown',function(e){
  var k=e.key;
  if((e.metaKey||e.ctrlKey)&&(k==='k'||k==='K')){
    if(app.hidden)return;
    e.preventDefault();
    cmdk.hidden?openOverlay(cmdk):closeOverlays();
    return;
  }
  if(!cmdk.hidden){
    if(k==='Escape')closeOverlays();
    else if(k==='ArrowDown'){e.preventDefault();if(ckSel<ckMatches.length-1){ckSel++;ckRender()}}
    else if(k==='ArrowUp'){e.preventDefault();if(ckSel>0){ckSel--;ckRender()}}
    else if(k==='Enter'){e.preventDefault();var mm=ckMatches[ckSel];if(mm){closeOverlays();go(mm.i,'jump')}}
    return;
  }
  var lib=document.getElementById('library');
  if(lib&&!lib.hidden){if(k==='Escape'&&!app.hidden)lib.hidden=true;return}
  if(!analyticsEl.hidden||!shortcuts.hidden){if(k==='Escape')closeOverlays();return}
  if(!overview.hidden){if(k==='Escape'||k==='g'||k==='G')closeOverlays();return}
  if(app.hidden)return;
  if(e.target&&(e.target.isContentEditable||(e.target.matches&&e.target.matches('input,textarea'))))return;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '){e.preventDefault();go(cur+1,'fwd')}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();go(cur-1,'back')}
  else if(k==='Home'){e.preventDefault();go(0,'jump')}
  else if(k==='End'){e.preventDefault();go(N-1,'jump')}
  else if(k==='g'||k==='G'){openOverlay(overview)}
  else if(k==='f'||k==='F'){toggleFS()}
  else if(k==='?'){openOverlay(shortcuts)}
  else if((k==='t'||k==='T')&&session&&session.role==='master'){runSelfTest()}
});

/* ---------------- interaction engine: tilt + sheen + magnetic + parallax ---------------- */
(function(){
  if(!FINE||REDUCED)return;
  var tiltEl=null,mx=0,my=0,raf=0;
  var magnets=[btnNext,btnPrev,btnPdf,$('#btnEnter')].filter(Boolean);
  function frame(){
    raf=0;
    if(document.body.classList.contains('editing')){if(tiltEl){tiltEl.style.transform='';}return}
    if(tiltEl){
      var r=tiltEl.getBoundingClientRect();
      var px=(mx-r.left)/r.width,py=(my-r.top)/r.height;
      px=Math.max(0,Math.min(1,px));py=Math.max(0,Math.min(1,py));
      var rx=(0.5-py)*6,ry=(px-0.5)*6;
      tiltEl.style.transform='perspective(1000px) rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) translateY(-8px) scale(1.02)';
      tiltEl.style.setProperty('--mx',(px*100).toFixed(1)+'%');
      tiltEl.style.setProperty('--my',(py*100).toFixed(1)+'%');
    }
    /* read phase */
    var reads=magnets.map(function(b){return b.offsetParent===null?null:b.getBoundingClientRect()});
    /* write phase */
    magnets.forEach(function(b,j){
      var r=reads[j];if(!r)return;
      var cx=r.left+r.width/2,cy=r.top+r.height/2;
      var dx=mx-cx,dy=my-cy;
      var dist=Math.hypot(dx,dy)||1;
      var reach=Math.max(r.width,r.height)/2+40;
      if(dist<reach){
        var pull=Math.min(3,(1-dist/reach)*3);
        b.style.translate=(dx/dist*pull).toFixed(1)+'px '+(dy/dist*pull).toFixed(1)+'px';
      }else if(b.style.translate){b.style.translate=''}
    });
    var nx=(mx/innerWidth-0.5)*2,ny=(my/innerHeight-0.5)*2;
    document.documentElement.style.setProperty('--plx',nx.toFixed(3));
    document.documentElement.style.setProperty('--ply',ny.toFixed(3));
  }
  addEventListener('pointermove',function(e){
    mx=e.clientX;my=e.clientY;
    if(!raf)raf=requestAnimationFrame(frame);
  },{passive:true});
  addEventListener('pointerover',function(e){
    var t=e.target.closest&&e.target.closest('[data-tilt]');
    if(t&&t!==tiltEl){
      if(tiltEl){tiltEl.classList.remove('tilting');tiltEl.style.transform=''}
      tiltEl=t;t.classList.add('tilting');
    }
  },true);
  addEventListener('pointerout',function(e){
    if(tiltEl&&e.target.closest&&e.target.closest('[data-tilt]')===tiltEl&&!tiltEl.contains(e.relatedTarget)){
      tiltEl.classList.remove('tilting');
      tiltEl.style.transform='';
      tiltEl=null;
    }
  },true);
})();

/* feedback: asked once, after the last slide, never blocking */
function askFeedback(){
  if(!session||session.role!=='client')return;
  var key=K('fb_done');
  try{if(localStorage.getItem(key))return}catch(err){}
  if(document.getElementById('fbcard'))return;
  var ov=document.createElement('div');
  ov.className='overlay';ov.id='fbcard';
  ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Your feedback');
  ov.innerHTML='<div class="fb-panel">'
    +'<button class="iconbtn fb-x" id="fbClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'
    +'<h3>We would appreciate your feedback.</h3>'
    +'<p class="fb-sub">It takes ten seconds and it makes the next report better.</p>'
    +'<label class="fb-lab">How would you rate the strategy, out of ten?</label>'
    +'<div class="fb-scale" id="fbScale">'+Array.from({length:10},function(_,i){
        return '<button class="fb-n" data-r="'+(i+1)+'">'+(i+1)+'</button>'}).join('')+'</div>'
    +'<label class="fb-lab">What did you think of the report? <span>Optional</span></label>'
    +'<textarea id="fbText" rows="3" placeholder="Anything at all"></textarea>'
    +'<button class="btn-solid fb-send" id="fbSend" disabled>Send feedback</button>'
    +'<p class="fb-note" id="fbNote">Choose a rating to send.</p></div>';
  document.body.appendChild(ov);
  var rating=0;
  ov.addEventListener('click',function(ev){
    var n=ev.target.closest('.fb-n');
    if(n){
      rating=+n.dataset.r;
      ov.querySelectorAll('.fb-n').forEach(function(b){b.classList.toggle('on',+b.dataset.r<=rating)});
      document.getElementById('fbSend').disabled=false;
      document.getElementById('fbNote').textContent='';
      return;
    }
    if(ev.target.closest('#fbClose')||ev.target===ov){
      try{localStorage.setItem(key,'skipped')}catch(err){}
      ov.remove();return;
    }
    if(ev.target.closest('#fbSend')){
      var b=REPORTS.beacon;
      var body={slug:CFG.meta.slug,rating:rating,comment:(document.getElementById('fbText').value||'').slice(0,1200),name:session.name||''};
      try{
        fetch(b.url+'/rest/v1/bbre_feedback',{method:'POST',keepalive:true,
          headers:{apikey:b.key,Authorization:'Bearer '+b.key,'Content-Type':'application/json',Prefer:'return=minimal'},
          body:JSON.stringify(body)}).catch(function(){});
      }catch(err){}
      try{localStorage.setItem(key,'sent')}catch(err){}
      ov.querySelector('.fb-panel').innerHTML='<h3>Thank you, '+esc((session.name||'').split(' ')[0]||'')+'.</h3><p class="fb-sub">That goes straight to the team.</p>';
      setTimeout(function(){ov.remove()},1900);
    }
  });
  document.addEventListener('keydown',function esc(ev){
    if(ev.key==='Escape'&&document.getElementById('fbcard')){
      try{localStorage.setItem(key,'skipped')}catch(err){}
      ov.remove();document.removeEventListener('keydown',esc);
    }
  });
}

/* B1: the self-test harness. Master only. ?selftest=1 or press T. */
function runSelfTest(){
  if(!session||session.role!=='master'||!CFG)return;
  var checks=[],t0=performance.now();
  function add(name,ok,note){checks.push({name:name,ok:!!ok,note:note||''})}

  add('Renderers threw nothing',window.__bbre.health().failedSlides===0,
      window.__bbre.health().failedSlides+' failed');
  var ids={},dup=[];
  CFG.slides.forEach(function(s){if(ids[s.id])dup.push(s.id);ids[s.id]=1});
  add('Slide ids unique',dup.length===0,dup.join(', '));
  var badIcons=[];
  CFG.slides.forEach(function(s){
    (s.cards||[]).concat(s.steps||[]).concat(s.groups||[]).forEach(function(x){
      if(x&&x.icon&&!RIC[x.icon])badIcons.push(x.icon);
    });
  });
  add('All icons defined',badIcons.length===0,badIcons.join(', '));
  add('Fonts loaded',document.fonts&&document.fonts.check('16px Fraunces')&&document.fonts.check('16px Inter'));
  add('Portal config warnings',PORTAL_WARNINGS.length===0,PORTAL_WARNINGS.length+' warnings (console)');
  var over=[];
  var was=cur;
  for(var i=0;i<N;i++){
    window.__bbre.force(i);
    var sl=document.querySelector('.slide.on');
    var els=sl.querySelectorAll('*');
    for(var k=0;k<els.length;k++){
      var el=els[k];
      if(el.closest('.tblwrap'))continue;
      var r=el.getBoundingClientRect();
      if(r.right>innerWidth+2&&r.width>2){over.push(i+1);break}
    }
  }
  window.__bbre.force(was<0?0:was);
  add('No horizontal overflow ('+innerWidth+'px)',over.length===0,'slides '+over.join(','));
  var pn=0;CFG.slides.forEach(function(s){if(s.pnote)pn++});
  add('Presenter notes master-gated',true,pn+' notes present, client render blocked by role check');

  bfetch('/rest/v1/rpc/bbre_summary',{p_slug:CFG.meta.slug}).then(function(rows){
    add('Beacon reachable',!!rows,rows?rows.length+' aggregate rows':'no response');
    var pass=checks.filter(function(c){return c.ok}).length;
    var ov=document.getElementById('selftest')||document.createElement('div');
    ov.className='overlay';ov.id='selftest';
    ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Self test');
    ov.innerHTML='<div class="st-panel"><div class="an-head"><span class="an-title">Self-test · '
      +esc(CFG.client.name)+'</span><button class="iconbtn" id="stClose" aria-label="Close">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'
      +'<p class="st-sum '+(pass===checks.length?'ok':'bad')+'">'+pass+' of '+checks.length+' checks passed · '
      +Math.round(performance.now()-t0)+'ms</p>'
      +checks.map(function(c){
        return '<div class="st-row"><span class="st-dot '+(c.ok?'ok':'bad')+'"></span><span>'+esc(c.name)+'</span><em>'+esc(c.ok?(c.note||'pass'):c.note||'FAIL')+'</em></div>';
      }).join('')+'</div>';
    if(!ov.parentNode)document.body.appendChild(ov);
    ov.hidden=false;
    ov.onclick=function(ev){if(ev.target===ov||ev.target.closest('#stClose'))ov.hidden=true};
  });
}

/* present mode: fullscreen + chrome fades when idle */
(function(){
  var bp=document.getElementById('btnPresent');
  if(bp)bp.addEventListener('click',toggleFS);
  var idleT=null;
  function poke(){
    document.body.classList.remove('idle');
    clearTimeout(idleT);
    if(document.fullscreenElement)idleT=setTimeout(function(){document.body.classList.add('idle')},2600);
  }
  document.addEventListener('fullscreenchange',function(){

/* auto-lite: sample real frame cadence; weak devices lose glass + tilt, keep the story */
(function(){
  if(REDUCED)return;
  var t0=performance.now(),last=t0,ds=[];
  function tick(n){
    ds.push(n-last);last=n;
    if(n-t0<1100)requestAnimationFrame(tick);
    else{
      ds.sort(function(a,b){return a-b});
      var p75=ds[Math.floor(ds.length*.75)]||16;
      if(p75>22){document.documentElement.classList.add('lite');console.warn('[perf] weak device detected (p75 frame '+p75.toFixed(1)+'ms): lite mode on')}
    }
  }
  requestAnimationFrame(tick);
})();

/* donut segment selection: the centre follows what you pick */
function pickSegment(scope,i,label,val){
  var svg=scope.querySelector('.donut');if(!svg)return;
  var v=svg.querySelector('.dc-val'),l=svg.querySelector('.dc-lbl');
  if(v){v.setAttribute('data-v',val+'%');v.textContent=val+'%'}
  if(l)l.textContent=label;
  svg.querySelectorAll('.seg').forEach(function(s){s.classList.toggle('sel',s.dataset.i===String(i))});
  var lg=scope.querySelector('.legend');
  if(lg)lg.querySelectorAll('li').forEach(function(li){li.classList.toggle('on',li.dataset.i===String(i))});
}
stage.addEventListener('pointerover',function(ev){
  var s=ev.target.closest('.seg');
  if(s)pickSegment(s.closest('.donut-block'),s.dataset.i,s.dataset.l,s.dataset.v);
});
stage.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter'&&ev.key!==' ')return;
  var t=ev.target.closest('.seg,.legend li');
  if(t){ev.preventDefault();pickSegment(t.closest('.donut-block'),t.dataset.i,t.dataset.l,t.dataset.v)}
});

/* pricing bands + sign-it + donut morph (delegated) */
stage.addEventListener('click',function(ev){
  var sg=ev.target.closest('.seg')||ev.target.closest('.legend li');
  if(sg){pickSegment(sg.closest('.donut-block'),sg.dataset.i,sg.dataset.l,sg.dataset.v);return}
  var tc=ev.target.closest('.tier-cta');
  if(tc){var tn=tc.textContent.replace('Choose','').trim();try{localStorage.setItem(K('tier'),tn)}catch(err){}}
  var bc=ev.target.closest('.band-chip');
  if(bc){
    var sl=null;CFG.slides.forEach(function(x){if(x.type==='pricing-tiers')sl=x});
    var b=sl.spendBands[+bc.dataset.b];
    bc.parentNode.querySelectorAll('.band-chip').forEach(function(x){x.classList.toggle('next',x===bc)});
    var ln=document.getElementById('bandLine');
    if(ln){ln.innerHTML='<b>'+esc(b.range)+'</b> · '+esc(b.line);ln.classList.remove('swap');void ln.offsetWidth;ln.classList.add('swap')}
    return;
  }
  var at=ev.target.closest('.acc-tier');
  if(at){at.parentNode.querySelectorAll('.acc-tier').forEach(function(x){x.classList.toggle('on',x===at)});return}
  var asend=ev.target.closest('.acc-send');
  if(asend){
    ev.preventDefault();
    var tier=(document.querySelector('.acc-tier.on')||{}).dataset;tier=tier?tier.t:'';
    var nm=(document.getElementById('accName')||{}).value||'';
    var msg='We are going ahead with the '+(tier||'recommended')+' package for '+CFG.client.name+'.'+(nm?' - '+nm:'');
    open('https://wa.me/'+asend.dataset.ph+'?text='+encodeURIComponent(msg),'_blank');
    return;
  }
  var mt=ev.target.closest('.morph-chip');
  if(mt){
    var wrap=mt.closest('.slide-inner');
    mt.parentNode.querySelectorAll('.morph-chip').forEach(function(x){x.classList.toggle('next',x===mt)});
    var blocks=wrap.querySelectorAll('.donut-block');
    blocks.forEach(function(bl,i){
      var show=(i===+mt.dataset.m);
      bl.classList.toggle('shown',show);
      if(show)bl.querySelectorAll('.seg').forEach(function(sg){var a=sg.style.animation;sg.style.animation='none';void sg.getBBox;sg.style.animation=a});
    });
  }
});

/* kinetic entry: three words, once per session */
function kineticEntry(done){
  var words=(CFG.meta.entryWords||[]);
  if(!words.length||REDUCED||!KINETIC){done();return}
  var ov=document.createElement('div');ov.className='kinetic';ov.setAttribute('aria-hidden','true');
  ov.innerHTML=words.map(function(w,i){return '<span style="animation-delay:'+(i*0.62)+'s">'+esc(w)+'</span>'}).join('');
  document.body.appendChild(ov);
  setTimeout(function(){ov.classList.add('bye');setTimeout(function(){ov.remove()},450)},words.length*620+700);
  setTimeout(done,words.length*620+500);
}

/* test/QA hook: navigation only, no data */
var failedSlides=0;
window.__bbre={
  go:function(i,m){go(i,m)},
  force:function(i){transBusy=false;pendingGo=null;go(i,'jump')},
  n:function(){return N},
  fps:function(seconds){
    seconds=seconds||3;
    return new Promise(function(res){
      var t0=performance.now(),last=t0,ds=[];
      (function tick(n){
        ds.push(n-last);last=n;
        if(n-t0<seconds*1000)requestAnimationFrame(tick);
        else{ds.sort(function(a,b){return a-b});
          res({frames:ds.length,avg:+(ds.reduce(function(a,b){return a+b},0)/ds.length).toFixed(2),
               p95:+ds[Math.floor(ds.length*.95)].toFixed(2),worst:+ds[ds.length-1].toFixed(2)})}
      })(t0);
    });
  },
  health:function(){
    return {
      slides:N,
      failedSlides:failedSlides,
      fontsLoaded:(document.fonts&&document.fonts.check)?document.fonts.check('16px Fraunces')&&document.fonts.check('16px Inter'):null,
      client:CFG?CFG.meta.slug:null
    };
  }
};
